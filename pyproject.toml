[project]
name = "codesage"
version = "0.1.0"
description = "Multi-LLM code review with mechanical grounding and cross-family consensus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Ruff is the only external analyzer. Its `S` rules are a reimplementation of Bandit,
# so running both meant every security finding was reported twice and the "two tools
# agree" corroboration signal was double-counting one tool.
analysis = ["ruff>=0.8"]
# Optional: an embedding backend for the finding-clustering ablation. The lexical
# default needs no model download and no torch.
embed = ["sentence-transformers>=3.3"]

[dependency-groups]
dev = [
    "httpx<1",
    "ruff>=0.8",
]

[project.scripts]
codesage = "codesage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "evals"]
# mini_repo is sample code the parser consumes, and evals/ injects deliberate bugs into
# copies of real repositories. Linting either would be linting the test data.
extend-exclude = [".codesage/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
